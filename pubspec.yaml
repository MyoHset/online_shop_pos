name: online_shop_pos
description: "A Point of Sale (POS) application for online sellers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.3

  # Immutable Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Functional Error Handling
  fpdart: ^1.1.0

  # UI / Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  gap: ^3.0.1

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  equatable: ^2.0.7
  window_manager: ^0.5.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^3.0.0


flutter:
  uses-material-design: true
